<!doctype html>
<!--
  Answer Book — Telangana IPE board-exam answer-writing guide.
  BUILT FILE: do not edit answer-book/dist/index.html by hand.
  Source: answer-book/shell.html + notebook.css + notebook.js + questions/*.json
  Build:  npm run build:answers
  Harvested from public/board-mvp.html (tracked reference): typing loop (L591-623),
  ruled-paper gradients (L137-139), accumulator CSS (L79-87), print block (L718-726).
-->
<!--__BUILT_AT__-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Answer Book — Physics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">📘</span>
    <span class="brand-name">Answer Book</span>
    <span class="brand-sub" id="boardLabel"></span>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-ghost" id="btnRestart" type="button">Restart</button>
    <button class="btn btn-ghost" id="btnPrint" type="button">Print</button>
  </div>
</header>

<section class="question-card" id="questionCard">
  <div class="question-meta" id="questionMeta"></div>
  <div class="question-text" id="questionText"></div>
</section>

<main class="layout">

  <aside class="rail">
    <div class="card">
      <div class="card-title">Answer plan</div>
      <div class="step-list" id="stepList"></div>
    </div>

    <div class="card accumulator" id="accCard">
      <div class="acc-value"><span id="accValue">0</span><span class="acc-total" id="accTotal">/8</span></div>
      <div class="acc-label">marks for what is written so far</div>
      <div class="acc-bar"><div class="acc-fill" id="accFill"></div></div>
    </div>

    <div class="card mode-card">
      <div class="card-title">Mode</div>
      <div class="mode-row" id="modeRow">
        <button class="mode-btn" type="button" data-mode="study">Study</button>
        <button class="mode-btn" type="button" data-mode="exam">Exam</button>
        <button class="mode-btn" type="button" data-mode="test">Test myself</button>
      </div>
      <p class="mode-hint" id="modeHint"></p>
    </div>

    <div class="card" id="marginNoteCard" hidden>
      <div class="card-title">How to earn it</div>
      <div class="margin-note" id="marginNote"></div>
    </div>

    <!-- Study-mode teaching layer. Rail only — the notebook page stays an answer
         script (Rules 24/34), and anything inside .step-block would be typed and
         would change pagination. -->
    <div class="card" id="whyCard" hidden>
      <div class="card-title">Why this step</div>
      <div class="why-note" id="whyNote"></div>
    </div>

    <div class="card" id="mistakeCard" hidden>
      <div class="card-title">Where marks are lost</div>
      <ul class="mistake-list" id="mistakeList"></ul>
    </div>

    <div class="card">
      <div class="card-title">Mark split</div>
      <div class="mark-split" id="markSplit"></div>
    </div>

    <div class="card verify-note" id="verifyNote" hidden></div>

    <!-- Assess panel — only in Test-myself mode. Two paths: write it on paper and
         self-score, or speak it and let the recall check grade it. The mic path
         appears only when a recall endpoint is configured, so with no endpoint the
         paper path still works completely and the page makes zero network calls. -->
    <section class="card assess-card" id="assessCard" hidden>
      <div class="card-title">Test yourself</div>

      <div id="assessStart">
        <p class="assess-intro">Write this answer on paper. Or speak it if you are short of time.</p>
        <div class="assess-timer" id="assessTimer"></div>
        <button class="btn btn-assess" id="btnDonePaper" type="button">I am done — check my paper</button>
        <button class="btn btn-mic" id="btnMic" type="button" hidden>
          <span class="mic-dot"></span><span id="micLabel">Speak it instead</span>
        </button>
        <p class="recall-intro" id="recallIntro" hidden></p>
      </div>

      <div class="recall-timer" id="recallTimer" hidden></div>
      <div class="self-score" id="selfScore" hidden></div>
      <div class="recall-result" id="recallResult" hidden></div>
    </section>

    <!-- AI assistant seam: slot only, no content, no fetch (see docs/patterns/answer_book.md) -->
    <aside id="pm-assistant-slot" hidden></aside>
  </aside>

  <section class="notebook-col" id="notebookCol">
    <div class="notebook" id="notebook"></div>
    <button class="btn btn-next" id="btnNext" type="button">Start writing</button>
  </section>

</main>

<script>
/*__DATA__*/
</script>
<script>
/*__JS__*/
</script>
</body>
</html>
